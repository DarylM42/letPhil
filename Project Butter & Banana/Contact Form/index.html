<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FFF8ED;
            --caramel: #8B5E3C;
            --caramel-dark: #6F4E37;
            --text-color: #4A3B2C;
            --text-soft: #7A6A57;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .contact-card {
            width: min(100%, 640px);
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 18px 40px rgba(74, 59, 44, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            color: var(--caramel-dark);
            margin: 0 0 8px;
        }

        p {
            margin: 0;
            color: var(--text-soft);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: var(--caramel-dark);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e6d9c6;
            border-radius: 10px;
            font: inherit;
            background: #fffdf6;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button {
            align-self: flex-start;
            border: 0;
            border-radius: 999px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            background: var(--caramel-dark);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            background: var(--caramel);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .contact-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="contact-card">
        <header>
            <h1>Contact Us</h1>
            <p>Send a message and I will get back to you soon.</p>
        </header>

        <form>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required />
            </div>

            <div class="form-group">
                <label for="phone-number">Phone Number</label>
                <input type="tel" id="phone-number" name="phone-number" required />
            </div>

            <div class="form-group">
                <label for="email-address">Email Address</label>
                <input type="email" id="email-address" name="email-address" required />
            </div>

            <div class="form-group">
                <label for="questions-comments">Questions and Comments</label>
                <textarea id="questions-comments" name="questions-comments" required></textarea>
            </div>

            <button type="submit">Submit Form</button>
        </form>
    </div>
</body>
</html>
